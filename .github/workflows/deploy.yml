name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proyecto-react-fs2/package-lock.json

      - name: Install dependencies
        working-directory: proyecto-react-fs2
        run: npm ci

      - name: Build
        working-directory: proyecto-react-fs2
        run: npm run build

      # SPA fallback: permite refresh / deep links (/login, /register) en GitHub Pages.
      - name: Add SPA fallback (404.html)
        run: cp proyecto-react-fs2/dist/index.html proyecto-react-fs2/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: proyecto-react-fs2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
